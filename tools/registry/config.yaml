# Development-only registry. Do not change the loopback bind for shared hosting.
storage: ../../.local/registry/storage
plugins: ./node_modules
auth:
  htpasswd:
    file: ../../.local/registry/htpasswd
    max_users: -1
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  "@sportsdesk-local/*":
    access: $all
    publish: $all
    unpublish: []
    # Local namespace never falls through to the public npm registry.
  "**":
    access: $all
    publish: []
    unpublish: []
    proxy: npmjs
listen: 127.0.0.1:4873
log:
  type: stdout
  format: pretty
  level: warn
